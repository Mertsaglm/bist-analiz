# ============================================================================
# BIST Analiz — Yapılandırma
#
# TÜM eşik / oran / URL / parametre BU DOSYADA. Koda sabit gömülmez.
# Bir eşiği değiştirmek isteyen tek yere bakar.
#
# Sayıların yanındaki yorumlar GEREKÇEDİR: nereden geldiği, ölçüldü mü yoksa
# varsayım mı. "TEYİT EDİLDİ" = doğrulandı; "VARSAYIM" / "ÖLÇÜLMEDİ" = henüz değil.
# ============================================================================

paths:
  db: "data/bist.db"
  db_dump: "data/bist.sql"
  universe_file: "universe.yaml"
  holidays_file: "holidays_tr.yaml"
  reports_dir: "reports"
  llm_in_dir: "llm/in"
  llm_out_dir: "llm/out"
  log_dir: "logs"
  # KALDIRILDI (2026-07-27 denetimi): `db_backup_dir` ve `llm_prompt_dir`
  # tanımlıydı ama kodda HİÇ okunmuyordu. Okunmayan bir config anahtarı,
  # onu değiştiren kişiye "bunu ayarladım" hissi veren sessiz bir yalandır.

# ----------------------------------------------------------------------------
# Veri kaynakları
# ----------------------------------------------------------------------------
sources:
  yf:
    suffix: ".IS"                  # BIST sembolleri Yahoo'da THYAO.IS biçiminde
    backfill_start: "2015-01-01"
    # İki fiyat serisi ayrı saklanır — hangisinin ne için kullanıldığı kritik:
    #   c     = auto_adjust=False Close  → bölünme düzeltmeli, temettü düzeltmesiz
    #           SEVİYE / ATR / PLAN fiyatları buradan
    #   c_tr  = Adj Close                → toplam getiri
    #           GETİRİ / MOMENTUM / FAKTÖR buradan
    # Ölçüm (2026-07-26): TUPRS 2025-03-28'de ham −%2.95, düzeltilmiş +%2.67.
    # İkisi gerçekten ayrışıyor; yanlışını kullanmak sessizce bozar.
    endeksler:
      XU100: "XU100.IS"
      XU030: "XU030.IS"
      XBANK: "XBANK.IS"
      XUSIN: "XUSIN.IS"
    kur:
      USDTRY: "USDTRY=X"
    istek_arasi_saniye: 0.4        # Yahoo'yu dövmemek için
    yeniden_deneme: 3

  evds:
    # gold_tracking_system'den birebir taşındı; 2026-07-07'de canlı keyle teyitli.
    # 2024 sonrası yeni servis yolu (evds2/service/evds SPA'ya yönleniyor).
    base: "https://evds3.tcmb.gov.tr/igmevdsms-dis"
    # API key .env içinde EVDS_API_KEY. Key HEADER'da gönderilir (Nisan 2024 kuralı).
    start_date: "01-01-2015"
    series:
      usdtry_sell:    "TP.DK.USD.S.YTL"       # günlük
      tufe:           "TP.FE.OKTG01"          # aylık — TÜFE endeksi (2003=100)
      aofm_politika:  "TP.APIFON4"            # günlük — AOFM, politika faizi vekili
      mevduat_1yil:   "TP.TRY.MT06"           # haftalık
      enf_bek_12ay:   "TP.ENFBEK.PKA12ENF"    # aylık — piyasa kat. 12 ay TÜFE beklentisi
    # ÇALIŞMAYAN kodlar (HTTP 400) — tekrar denemeyin: TP.PY.P01, TP.APIFON1, TP.MEVDUATTL
    backfill: [usdtry_sell, tufe, aofm_politika, mevduat_1yil, enf_bek_12ay]
    gunluk_pencere_gun: 45
    mevduat_stopaj_pct: 15.0

  kap:
    # ÖLÇÜLDÜ 2026-07-27: POST /tr/api/disclosure/members/byCriteria doğru
    # başlıklarla (User-Agent + Referer) 200 ve JSON dönüyor. Planın
    # "308 yönlendirme" notu YANLIŞ çıktı — yine L-005.
    # KAP tek tier-1 kaynaktır: şirketin kendi resmî beyanı. Ana akım finans
    # basını ve forumlar BİLEREK dışarıda — güvenilirlikleri ölçülmedi.
    #
    # ⚠ KAP damgaları İSTANBUL YEREL SAATİDİR; `disclosures.published_utc`
    # kolonuna yazılmadan önce UTC'ye çevrilir (`kap._parse_dt`, migration v6).
    # İlk sürüm naif bırakıyordu → `predictions.created_utc` ile metin
    # karşılaştırmasında 3 saatlik sessiz kayma.
    #
    # ⚠ `bist haber cek` ÇIKIŞ KODU: 0 temiz · 1 aralık atlandı · 2 KAP hatası.
    # Boş haber listesi "bildirim yok" anlamına GELMEZ; pakette
    # `haber_taramasi.ok` alanına bak.
    enabled: true
    base: "https://www.kap.org.tr"
    disclosures_path: "/tr/api/disclosure/members/byCriteria"
    user_agent: "bist-analiz/0.1 (kisisel arastirma)"
    # Tam çekimde (`--tam`) kaç gün geriye gidilir.
    # KARAR (2026-07-27): 90 gün. Haber katmanının değeri İLERİYE dönüktür —
    # karar anında veto. Geçmiş KAP'ın hiçbir tüketicisi yok; hiçbir ölçüm
    # onu okumuyor ve pakette hisse başına zaten `limit=8` var. Daha derin
    # çekim repoyu şişirir, hiçbir soruyu cevaplamaz.
    tam_cekim_gun: 90
    # ⚠ Tek istekte istenen dilim genişliği. KAP GENİŞ PENCEREYİ SESSİZCE
    # KIRPIYOR — ölçüldü (2026-07-27, canlı API):
    #     7 gün →  931 kayıt, tam       14 gün → 1578 kayıt, tam
    #    21 gün → 1578 kayıt, KIRPIK    90 gün → 1578 kayıt, KIRPIK
    # Yani ~1578'de doyup yalnız EN YENİ kısmı veriyor. 7 gün, 14'lük
    # doyma sınırına iki kat pay bırakır. Dilim yine de kırpılırsa
    # `bist haber cek` bunu ATLANAN ARALIK olarak basar ve 1 döner.
    parca_gun: 7
    # --- BEKLENEN BİLDİRİM (ileriye dönük bilanço takvimi) — 2026-08-07 ------
    # KAP `beklenen-bildirim-sorgu`: hangi şirketin finansal raporu HENÜZ
    # AÇIKLANMAMIŞ ve hangi pencerede beklendiği. 20 işlem günlük ufkumuzun
    # EN BÜYÜK tek olay riski budur ve sistemde hiç yoktu; ex-temettü tarihini
    # eliyorduk ama bilançoyu görmüyorduk.
    #
    # ÖLÇÜLDÜ (2026-08-07, canlı API):
    #   HTTP 200 · 20 gün → 1804 kayıt/571 şirket · 45 gün → 1863/576
    #   180 gün → **2000** · 365 gün → **2000**  ← TAVAN, liste kırpık
    #   `stockCode` kayıtların yalnız %6.7'sinde dolu → ticker'a ORADAN bağlanmaz
    #   `kapTitle` ↔ bizim `disclosures.company` eşleşiyor: 70 ticker'ımızın
    #   42'si 20 günlük pencerede çözüldü (kalan 28 zaten açıklamış).
    #
    # ⚠ Tavana dayanan yanıt SAKLANMAZ. Kırpık listede "yok" demek "bildirimi
    # yok" değil "göremedim"dir ve bu ikisi aynı değere düşerse tam olarak
    # L-007'ye düşeriz. Kırpılırsa eski (tam) anlık görüntü korunur ve yaşı
    # `bilinmiyor`u tetikler.
    beklenen_bildirim:
      enabled: true
      path: "/tr/api/expected-disclosure-inquiry/company"
      pencere_gun: 45          # 1863 kayıt — 2000 tavanına pay bırakır
      tavan_kayit: 1950        # bu sayıya ulaşan yanıt KIRPIK sayılır
      # Anlık görüntü bu yaştan eskiyse `bilinmiyor` — bayat takvim, olmayan
      # takvimden daha tehlikelidir (bugün açıklanmış olabilir).
      maks_yas_gun: 7
    # Bir dilim bu kadar kayıt döndürdüyse yanıt TAVANA DAYANMIŞ demektir.
    # Ölçülen tavan ~1578; 1400 güvenli pay bırakır. Yalnız bu eşik AŞILDIĞINDA
    # ve dönen en eski kayıt istenen başlangıçtan yeniyse "kırpıldı" denir —
    # aksi halde bildirimsiz bir gün (tatil) yanlış alarm üretiyordu.
    doyma_esigi: 1400

# ----------------------------------------------------------------------------
# İşlem takvimi
# ----------------------------------------------------------------------------
takvim:
  # GEÇMİŞ işlem günleri endeks barlarından TÜRETİLİR — otoriter, sıfır bakım.
  # holidays_tr.yaml YALNIZCA gelecek tarihler için (zaman bariyeri hesabı).
  turet_kaynak_endeks: "XU100"
  # ⚠ ESKİ NOT YANLIŞTI: "eksik 9 hafta-içi gün holidays_tr.yaml ile BİREBİR
  # aynı" deniyordu. 2026-07-29'da taze veriyle ölçülünce yanlış çıktı: yfinance
  # BİR SEANS GÜNÜNDE de endeks barı vermeyebiliyor ve bunu sessizce yapıyor.
  # Ölçüldü (2015-2026, gerçek veri) — ayrım GRİ BÖLGESİZ:
  #
  #     endeks barı YOK ama hisse barı VAR   →  10 gün, hepsinde 67-70 hisse
  #     holidays_tr.yaml'deki gerçek tatiller →  12 gün, hepsinde  0 hisse
  #
  # Yani "endeks barı yok" ile "borsa kapalıydı" AYNI ŞEY DEĞİL. Tek kaynağa
  # güvenmek 10 günü tatil sayıyor ve o günleri kapsayan HER zaman bariyeri /
  # holding_days hesabını kaydırıyordu (yfinance 2026-07-24 ve 2026-07-28'i
  # XU100/XU030/XBANK'in ÜÇÜNDE birden vermiyor; 70 hissenin hepsi işlem gördü).
  #
  # Bu eşik o yüzden var: bir günde bu kadar hisse işlem gördüyse borsa AÇIKTI,
  # endeks barı gelmemiş olsa bile. Ölçülen dağılımda 0 ile 67 arasında hiçbir
  # gözlem yok; eşik geniş bir boşluğun ortasında duruyor, sınırında değil.
  min_hisse_bari_seans_icin: 10
  timezone: "Europe/Istanbul"
  # TEYİT EDİLDİ 2026-07-26: emir toplama 09:40 başlar, sürekli işlem 10:00-18:00
  # KESİNTİSİZ (öğle arası 2016'da kaldırıldı), kapanış seansı 18:10'da biter.
  seans:
    acilis_muzayede_baslangic: "09:40"
    surekli_islem_baslangic:   "10:00"
    surekli_islem_bitis:       "18:00"
    kapanis_muzayede_bitis:    "18:10"

# ----------------------------------------------------------------------------
# Evren ve veri kalitesi kapıları
# ----------------------------------------------------------------------------
evren:
  min_medyan_islem_hacmi_try: 200_000_000    # 63 günlük medyan, canlı evren eşiği
  min_gecmis_gun_olcum: 2000                 # ~8 yıl → in_measure=1 olabilmek için
  maks_sifir_hacim_orani: 0.05               # 252g. SASA vakası: 0.232 → elenmeli
  maks_bar_bosluk_gun: 10
  maks_bayat_kapanis_gun: 5                  # aynı kapanış üst üste kaç gün
  aciklanamayan_sicrama_pct: 15.0            # |getiri| bu eşiğin üstü + kurumsal işlem yok → bayrak
  # --- DÜZELTİLMEMİŞ KURUMSAL İŞLEM eşiği (2026-08-07) -----------------------
  # `aciklanamayan_sicrama_pct` ile AYNI ŞEY DEĞİL, farklı bir soru sorar:
  #   o    → "bu sıçramanın KAYDI var mı?"      kayıt varsa AFFEDER
  #   bu   → "bu sıçrama HİÇ OLMAMALIYDI"       kayıt olsa da affetmez
  # Kural: **düzgün geriye düzeltilmiş bir seride −%50'lik bar bulunmaz.** Bir
  # bedelsiz düzeltildiğinde ex-tarihteki getiri ~0 olur; seride duruyorsa
  # düzeltme başarısız olmuştur. CCOLA tam bunu gösterdi: kayıt VARDI
  # (2024-08-13) ama seri düzeltilmemişti ve gerçek düşüş 2024-08-01'deydi —
  # yani kayda bakan kontrol bunu ya affeder ya da yanlış günü suçlar.
  #
  # ÖLÇÜLDÜ (2026-08-07, 197.191 bar, 70 isim) — getiri dağılımının uçları:
  #   GERÇEK piyasa ucu : +%22.2 (2023-02-15 deprem kapanışı sonrası açılış;
  #                       25 isim birden +%18…+%22) · −%28.3 (2020-03-12 COVID)
  #   ARTEFAKT          : +%94.6 TSPOR · −%90.7 CCOLA · +%72.5 AYGAZ ·
  #                       −%64.8 HEKTS · +%44.1 HEKTS
  # İki küme arasında %28–%44 BOŞLUĞU var; eşik oraya konur.
  duzeltilmemis_kurumsal_pct: 35.0

# ----------------------------------------------------------------------------
# Göstergeler — tek kaynak, dondurulmuş, versiyonlu
# ----------------------------------------------------------------------------
gostergeler:
  set_version: "core_indicators_v1"
  sma: [20, 50, 200]
  ema: [12, 26]
  rsi_length: 14                   # Wilder yumuşatma
  macd: { fast: 12, slow: 26, signal: 9 }
  bollinger: { length: 20, std: 2.0 }
  atr_length: 14                   # Wilder
  adx_length: 14                   # Wilder
  vol_pencere_gun: 63              # yıllıklaştırılmış volatilite
  hacim_sma: 20
  min_bar_hesap_icin: 250          # bu barın altında gösterge None döner — sessizce NaN DEĞİL

seviyeler:
  set_version: "levels_v1"
  pivot_k: 5                       # fraktal sol/sağ bar
  # LOOK-AHEAD KORUMASI: t anında yalnız confirm_idx <= t olan pivot kullanılır.
  # Bir pivot k bar sonra bilinebilir. Bu gecikmeye uyulmazsa TÜM ölçüm geçersizdir.
  pencere_bar: 500
  yeniden_hesap_bar: 10            # seviyeler yavaş hareket eder; her gün kurmak O(n²) maliyet, sıfır bilgi
  kumeleme_atr_carpani: 0.5        # bu kadar ATR içindeki pivotlar tek seviyeye toplanır
  min_dokunus: 2

# ----------------------------------------------------------------------------
# Faktörler — 3 + 1 hipotez. Ölçülmemiş faktör eklenmez.
# ----------------------------------------------------------------------------
faktorler:
  set_version: "factors_v1"
  winsor_pct: [5, 95]
  # ÖLÇÜLDÜ (2026-07-26, 2016-2026, eşit-ağırlık tabana göre, %0.30 maliyet):
  # sektör nötralizasyonu KENARI DÜŞÜRÜYOR — 6-1 mom t: 1.86 → 0.62.
  # BIST'te sektör momentumu sinyalin kendisi. Kod yolu var, VARSAYILAN KAPALI.
  sektor_notr: false
  agirliklar:
    mom_6_1: 0.45          # +0.85pp/15g vs EW, t=1.86, N=161
    mom_12_1: 0.30         # +0.94pp, t=1.82
    high52_prox: 0.15      # H=42'de +2.06pp t=2.04 — H<21'de ağırlık 0'a çekilir
    volscaled_mom: 0.10    # HİPOTEZ — ÖLÇÜLMEDİ. OOS'ta katkı yoksa 0'a düşer.
  high52_min_ufuk_gun: 21  # zaman bariyeri bunun altındaysa high52_prox ağırlığı 0
  kapilar:
    sma200_tolerans: 0.02  # close < sma200*(1-tol) → uygun değil

# ----------------------------------------------------------------------------
# Piyasa rejimi — pozisyon boyutunu ve nakdi etkiler, FAKTÖR AĞIRLIKLARINI DEĞİL.
# (Rejim-koşullu ağırlığın kenar taşıdığı ÖLÇÜLENE kadar.)
# ----------------------------------------------------------------------------
rejim:
  esikler:
    risk_on:    { xu100_sma200_farki_pct_min: 3.0,  genislik_sma50_ustu_pct_min: 60.0 }
    risk_off:   { xu100_sma200_farki_pct_maks: -3.0, genislik_sma50_ustu_pct_maks: 35.0 }
  politika:      # nakit %, maks pozisyon, boyut çarpanı
    risk-on:    { nakit_pct: 20.0, maks_pozisyon: 6, boyut_carpani: 1.00 }
    neutral:    { nakit_pct: 40.0, maks_pozisyon: 5, boyut_carpani: 0.85 }
    transition: { nakit_pct: 55.0, maks_pozisyon: 4, boyut_carpani: 0.65 }
    risk-off:   { nakit_pct: 80.0, maks_pozisyon: 2, boyut_carpani: 0.40 }
  sektor_basi_maks_pozisyon: 2     # sektör kontrolü SKORDA değil, KISITTA

# ----------------------------------------------------------------------------
# Risk ve emir mekaniği
# ----------------------------------------------------------------------------
risk:
  pozisyon_basi_risk_pct: 1.0      # portföyün yüzde kaçı stop'ta kaybedilir
  maks_pozisyon_pct: 10.0
  # TEYİT EDİLDİ 2026-07-26 — web kaynağından değil, KENDİ VERİMİZDEN ölçüldü.
  # Yöntem: her ticker'ın SON kurumsal işleminden sonraki barlar (bölünme düzeltmesi
  # uygulanmamış, yani ham tick ızgarası korunmuş) → 4.372 bar, 2020-11 … 2026-07.
  # Her fiyat bandında "tüm fiyatları tam bölen en büyük adım" arandı:
  #     0-20 TL    1618 bar   1kr:%100  2kr:%51            → adım 0.01
  #    20-50 TL    1435 bar   2kr:%100  5kr:%27            → adım 0.02
  #    50-100 TL    294 bar   5kr:%100 10kr:%55            → adım 0.05
  #   100-250 TL    525 bar  10kr:%100 25kr:%29            → adım 0.10
  #   250-500 TL    500 bar  25kr:%100 50kr:%62            → adım 0.25
  # Yuvarlanmamış fiyat = UYGULANAMAZ plan; bu tablo planlayıcının şartıdır.
  fiyat_adimlari:
    - { ust_sinir: 19.99,   adim: 0.01 }   # ölçüldü
    - { ust_sinir: 49.98,   adim: 0.02 }   # ölçüldü
    - { ust_sinir: 99.95,   adim: 0.05 }   # ölçüldü
    - { ust_sinir: 249.90,  adim: 0.10 }   # ölçüldü
    - { ust_sinir: 499.75,  adim: 0.25 }   # ölçüldü
    # ⚠ ESKİ NOT YANLIŞTI: "evrende 500 TL üstü fiyat gözlemi yok" deniyordu.
    # Faz 2'de ölçüm evreni 67 isme çıkınca bu iddia geçersiz oldu ama not
    # güncellenmedi (2026-07-27 denetimi). Şimdi ÖLÇÜLDÜ — yöntem aynı:
    # son kurumsal işlemden SONRAKİ barlarda ardışık FARKLI fiyatların
    # en küçük farkı (ham tick ızgarası korunmuş).
    #
    #   500-1000 TL · 1.345 farklı fiyat · BRSAN GUBRF MGROS OTKAR TTRAK
    #       en küçük fark 0.10 (gürültü) · baskın 0.50 %68.5 · 1.00 %11.7
    #       · 1.50 %3.5 → hepsi 0.50'nin katı  → VARSAYIM DOĞRULANDI
    #
    #   1000+ TL · 735 farklı fiyat · YALNIZ EGEEN
    #       en küçük fark **2.50** · 2.50 %55.7 · 5.00 %22.0 · 7.50 %10.1
    #       · 10.00 %5.1 · 12.50 %2.7 → hepsi 2.50'nin katı, 1.00 HİÇ YOK
    #       → VARSAYIM (1.00) **YANLIŞTI**, düzeltildi.
    - { ust_sinir: 999.50,  adim: 0.50 }   # ÖLÇÜLDÜ 2026-07-27
    # ⚠ TEK İSİMLE ölçüldü (EGEEN). Bandın tamamını temsil ettiği varsayımı
    # sürüyor; ikinci bir isim bu banda girerse yeniden ölç.
    - { ust_sinir: null,    adim: 2.50 }   # ÖLÇÜLDÜ 2026-07-27 (tek isim)
  gunluk_fiyat_limiti_pct: 10.0    # ±%10 — ATR'ye göre %12 uzaktaki stop bir günde tetiklenemez
  # Gidiş-dönüş maliyet: komisyon + BSMV + spread. Ölçüm: maliyet kenarın ~1/3'ünü yiyor.
  islem_maliyeti_gidis_donus_pct: 0.30

  # --- Limit durumu sınıflandırıcısı (2026-08-07) --------------------------
  # ÖLÇÜLDÜ, uydurulmadı. Yöntem: her bar için getiri = c/önceki_c - 1, canlı
  # evren 19 isim × 50.999 bar (tüm geçmiş) ve 9.424 bar (son 2 yıl).
  #
  #   GERÇEK KİLİT  |getiri| ∈ [%9.0, %10.5]   496 bar  %0.97   (son 2y %0.87)
  #   İNTRADAY DOKUNMA (h/l banda değdi)       891 bar  %1.75
  #   LİMİT ÖTESİ   |getiri| > %10.5            70 bar  %0.14   (son 2y **0**)
  #
  # Yani ~100 barda 1'i limitte kapanıyor — ihmal edilebilir değil, üstelik tam
  # da bir şeyler olan günlerde oluyor.
  #
  # ⚠ "LİMİT ÖTESİ" bir ölçüm hatası DEĞİL, AYRI BİR OLGU (L-003: iki farklı
  # olguyu aynı kelimeyle raporlama). Tarihlerine bakıldığında hepsi piyasa
  # geneli olağanüstü gün: 2016-07-18 (15 Temmuz sonrası ilk seans),
  # 2020-03-12/16 (COVID), 2023-02-15 (deprem kapanışından sonra açılış),
  # 2018-06/07 (kur krizi). O günlerde ±%10 modeli geçerli değildir ve
  # `daily_limit_note`'un "tek günde tetiklenemez" iddiası YANLIŞTIR.
  #
  # Oranlar `gunluk_fiyat_limiti_pct`e GÖRELİDİR — limit değişirse bantlar
  # kendiliğinden kayar (L-011: eşiği koda gömme, tek kaynaktan oku).
  limit_bandi:
    kilit_alt_orani: 0.90    # |getiri| ≥ limit×0.90 (= %9.0)  → kilitli
    disi_ust_orani: 1.05     # |getiri| > limit×1.05 (= %10.5) → limit_disi
    yakin_orani: 0.75        # |getiri| ≥ limit×0.75 (= %7.5)  → limite_yakin


# ----------------------------------------------------------------------------
# Plan üretici (deterministik menü)
# ----------------------------------------------------------------------------
planlayici:
  # ÖLÇÜLDÜ: 6-1 mom, üst-6, %0.30 maliyet, EW tabana göre —
  #   H=5:  −0.01pp t=−0.05   (kenar YOK)
  #   H=15: +0.72pp t=1.82
  #   H=21: +1.13pp t=2.07    ← bariyeri bandın ÜST ucuna koymak bedava iyileşme
  zaman_bariyeri_gun: 20
  stop_atr_bandi: [1.5, 4.0]       # dışındaysa plan geçersiz
  stop_yontemleri: [atr_2x, atr_2.5x, atr_3x, swing_low, sma_break_buffer]
  min_rr_t1: 1.5
  maks_plan_per_hisse: 3
  # Giriş bandı fiyattan en fazla bu kadar ATR aşağıda olabilir.
  # VAKA (2026-07-26): EUPWR fiyat ~90 TL iken 3 yıl önceki 32 TL seviyesi
  # "destek retest" diye plan üretti (R:R 6.39) — tetiklenemez bir artefakt.
  # Mutlak yüzde değil ATR ölçekli: volatil ve sakin hisse aynı kefeye konmasın.
  maks_giris_uzakligi_atr: 3.0
  # Hedefler UYDURULMAZ — yalnız gerçek pivot/direnç seviyelerinden.
  # Geçerli seviye yoksa hedef üretilmez, plan üretilmez.
  hedef_kaynaklari: [pivot, yuksek_52h]

# ----------------------------------------------------------------------------
# LLM sınırı — LLM hesaplanabilir hiçbir sayıyı üretmez
# ----------------------------------------------------------------------------
llm:
  bundle_version: "bist_bundle_v1"
  output_schema_version: "bist_llm_v1"
  enums:
    signal: [strong_buy, buy, accumulate, hold, reduce, sell, avoid]
    action: [plan_sec, plan_reddet, izle, islem_yok]
    confidence: [yuksek, orta, dusuk]
    veto_code: [haber_riski, kurumsal_islem, likidite_zayif, sektor_yogunlugu,
                tez_zayif, veri_supheli, rejim_uyumsuz]
    regime_agreement: [katiliyorum, katilmiyorum]
    portfolio_action: [risk_azalt, koru, risk_artir]
    # Elle koşulan araçlar + otonom zincirdeki model kimlikleri.
    # ⚠ `zincir`deki her model BURADA da olmalı; yoksa HF denetimi (tool enum
    # dışında) otonom turların HEPSİNİ reddeder ve hata "model bozuk" gibi
    # görünür. Zorlanıyor: tests/test_analist.py::test_zincir_modelleri_enum_icinde
    tool: [claude-code, codex, antigravity, kiro, diger,
           gemini-3.5-flash, gemini-3.6-flash, gemini-2.5-pro,
           gemini-3.1-pro-preview, gpt-5.6-luna, gpt-5-mini]
  # confidence_p'yi KOD yazar; LLM enum verir. Sayısal güven LLM'den ASLA gelmez.
  # Bu haritanın kendisi kalibre edilecek (Faz 6+, 2 yıl "ölçüm yetersiz" diyecek).
  # --- VETO SÜRESİ (2026-08-07, Merdiven'in "bypass" fikrinden) --------------
  # NE EKSİKTİ: veto bir KOŞUYA bağlıydı, takvime değil. Bugün `haber_riski`
  # diye veto edilen bir isim, hiçbir şey değişmeden yarın tertemiz görünüyordu
  # — çünkü ertesi günün paketinde vetonun izi yoktu. ADR #008'den beri veto
  # sistemin KALAN ANA ÜRÜNÜ; ömrü tek bir koşu kadar olmamalı.
  #
  # Merdiven bunu sembol başına saat cinsinden süreli "bypass" ile çözüyor.
  # Bizde birim İŞLEM GÜNÜ (H=20 ufkuyla aynı takvim). Süre veto SEBEBİNE göre
  # değişir: bir haber riski birkaç günde soğur, likidite sorunu soğumaz.
  #
  # ⚠ Bu süreler ÖLÇÜLMEDİ — vetonun kendi isabeti henüz ölçülemiyor
  # (`bist degerlendir`, ~1 yıl gerekiyor). Şu an makul varsayımlar ve
  # bilerek KISA tutuldular: uzun veto, ölçülmemiş bir inancı uzun süre
  # dayatmaktır. Veto değeri ölçülünce buraya ölçüm gelir.
  veto_suresi_gun:
    varsayilan: 5
    haber_riski: 3          # haber etkisi hızla fiyata geçer
    kurumsal_islem: 20      # ex-tarih plan ufku boyunca geçerli
    likidite_zayif: 20      # yapısal, hızlı değişmez
    sektor_yogunlugu: 10
    tez_zayif: 5
    veri_supheli: 10
    rejim_uyumsuz: 5

  guven_olasilik: { yuksek: 0.65, orta: 0.50, dusuk: 0.38 }
  min_prose_karakter: 80
  strong_buy_min_yuzdelik: 70.0    # HF-22: LLM sıralamayı bu bandın ötesinde ezemez

  # --------------------------------------------------------------------------
  # Otonom analist zinciri (ADR #013) — SIRAYLA denenir, ilk TEMİZ çıktı kazanır.
  #
  # "Temiz" = JSON parse edildi VE `bist denetle` sert hata bulmadı. Yani HF
  # denetimi zincirin bir halkası gibi çalışır: şemaya uyan ama denetimden
  # geçemeyen çıktı "cevap verilmedi" sayılır ve sıradaki model denenir.
  #
  # SIRA GEREKÇESİ (maliyet 2026-07-29'da GERÇEK paketle ölçüldü:
  # girdi ~10.0K token, çıktı ~8.2K token):
  #   1-3  ÜCRETSİZ katmanı olan Gemini'ler. Günde 1 istek attığımız için
  #        ücretsiz kota pratikte hiç dolmaz; sıra kotaya göre değil KALİTEYE
  #        göre kuruldu. 3. sıradaki 2.5-pro bilinçli olarak FARKLI NESİL:
  #        1-2 birden düşerse sorun aile geneli demektir, kardeş model kurtarmaz.
  #   4    gemini-3.1-pro-preview — ücretsiz katmanı YOK (~$0.12/tur) ama en
  #        güçlü Gemini. Buraya düşmek "tüm ücretsiz Gemini'ler tıkandı" demek.
  #   5-6  OpenAI — DAİMA sonda (kullanıcı kuralı). luna ~$0.012, mini ~$0.019.
  # Her gün 4. halkaya düşülse bile ay maliyeti ~$2.6; gerçekte oraya düşmek
  # istisna olacak.
  #
  # ⚠ 4. sıra PREVIEW bir model: kimliği değişebilir ya da emekli olabilir.
  # Zincir hatayı yutup sıradakine geçtiği için bozulma yumuşak; haftalık rapor
  # model başına kaç tur cevaplandığını gösterdiği için sessiz de kalmaz.
  zincir:
    - gemini-3.5-flash          # ücretsiz · "en akıllı" flash · ana analist
    - gemini-3.6-flash          # ücretsiz · kardeş model, ayrı kota kovası
    - gemini-2.5-pro            # ücretsiz · Pro sınıfı, FARKLI nesil
    - gemini-3.1-pro-preview    # ücretli ~$0.12/tur · en güçlü Gemini
    - gpt-5.6-luna              # ücretli ~$0.012/tur
    - gpt-5-mini                # ücretli ~$0.019/tur
  # Düşünme bütçesi. Gemini 3+ `thinkingLevel` alır; gemini-2.5-* bu alanı
  # TANIMAZ ve gönderilirse 400 döner (inkline'da yaşandı) — kod sürüme bakıp
  # göndermez. OpenAI tarafında karşılığı `reasoning_effort`.
  zincir_dusunme:
    gemini: "high"      # yargı kalitesi > hız; günde 1 istek, acele yok
    openai: "medium"
  # Zincirin son halkasında kaç kez tekrar denensin. Ara halkalarda tekrar YOK:
  # asıl yedekleme zincirin kendisidir, aynı modele ısrar etmek zaman kaybı.
  son_halka_tekrar: 2
  istek_zaman_asimi_s: 180
  # Çıktı token tavanı. AÇIKÇA verilmezse sağlayıcının varsayılanına düşer ve
  # uzun çıktı SESSİZCE kesilir — hata "geçersiz JSON" diye görünür, sebebi
  # görünmez (2026-08-01'de yaşandı: gemini-3.5-flash 17.000 karakterde
  # kesildi ve zincir gereksiz yere bir sonraki modele düştü).
  # 18 hisselik gerçek çıktı ~4.3K token; DÜŞÜNME token'ları da aynı bütçeden
  # yendiği için pay geniş bırakıldı. Evren büyürse bu sayı da büyümeli.
  maks_cikti_token: 32000

denetim:
  # HF-17 taşıyıcı kol: prose'daki HER sayısal token bundle'da olmalı.
  #
  # ⚠ BU KOLUN GERÇEK GÜCÜ ÖLÇÜLDÜ (2026-07-27, canlı paket, 1054 izinli token):
  #     -50..+50 tamsayılar          → %56'sı izinli
  #     ±20 aralığı, 1 ondalık       → %15'i izinli
  #     100-120 aralığı, 2 ondalık   → %0.5'i izinli
  # Yani tasarlandığı hata modunda ("hedef 324.75 TL") ÇALIŞIYOR; prose'un
  # doğal kaydında ("%20 potansiyel") ÇALIŞMIYOR. Bu, aşağıdaki beyaz
  # listelerin BİLİNÇLİ sonucudur — küçük tamsayıları yasaklamak modeli
  # anlamsız dolambaçlara iterdi. Sınır README'de de yazılı; gizlenmiyor.
  #
  # Aynı denetimde KAZARA bir sızıntı bulundu ve kapatıldı: paketteki ISO
  # tarihler ("2026-07-24") regex'te -07 / -24 olarak yakalanıyor ve izinli
  # listeye NEGATİF TAMSAYI enjekte ediyordu; hangi negatif sayının geçtiği
  # o günkü TAKVİME bağlıydı. Artık tarih kalıpları maskeleniyor
  # (`llm_io._TARIH_MASKESI`).
  sayisal_beyaz_liste_yil: [1900, 2100]
  sayisal_beyaz_liste_tamsayi_maks: 31        # gün sayıları, küçük sayımlar
  ek_izinli_sayilar: [0, 1, 2, 3, 5, 10, 20, 50, 100]
  ondalik_tolerans_basamak: 2

# ----------------------------------------------------------------------------
# Ölçüm — projenin epistemolojisi burada
# ----------------------------------------------------------------------------
olcum:
  # BİRİNCİL TABAN: eşit-ağırlık, veri-kalite kapısından geçmiş canlı evren.
  # ÖLÇÜLDÜ (2026-07-26, 29 likit isim, H=15, örtüşmeyen, N=175):
  #   eşit-ağırlık sepet vs XU100 = +0.36pp, kazanma %60, t=2.89
  # Yani SIFIR beceriyle XU100 yeniliyor. XU100'e göre alfa bunu sessizce içerir.
  # XU100 raporda kalır ama YALNIZ iletişim amaçlı, "sermaye-ağırlık eğilimi içerir"
  # etiketiyle. Hüküm daima EW tabana göre verilir.
  birincil_taban: "esit_agirlik_evren"
  ikincil_taban: "XU100"
  ufuklar_gun: [5, 10, 15, 21, 42, 63]
  ana_ufuk_gun: 20
  # H=5'te ölçülen kenar SIFIR (−0.01pp, t=−0.05, N=485).
  # "1 hafta" çerçevesi sunulur ama kalıcı bu etiketle ve skorlamaya girmeden.
  kenarsiz_ufuklar: [5]
  oos_split: "2023-01-01"
  # gold_tracking_system'den taşınan hüküm kuralı:
  # ZAYIF N, BÜYÜK FARKI EZER. En güçlü ifade "zayıf kanıt"tır — "doğrulandı" dalı YOKTUR.
  zayif_n_esigi: 15
  min_anlamli_fark_puan: 1.0
  maliyet_duyarliligi_pct: [0.0, 0.15, 0.30, 0.50]

# ============================================================================
# SAĞLIK — kesitsel akıl sağlığı devre kesicisi (2026-08-07)
#
# Fikir Merdiven'den: "aynı mumda 30'dan fazla AL sinyali gelirse bypass —
# 30 hisse aynı anda ucuz olamaz." Genelleştirilmiş hâli: **kesit tek yöne
# düştüyse bozulan piyasa değil, ölçüm aracıdır.**
#
# L-007 "payda sessizce daralır" demişti; bu onun aynadaki görüntüsü:
# **pay sessizce şişer.** Ve L-008 "simetriğini ara" diyor: LLM tarafında bu
# kural HF-23 (rejim tavanı) ile ZORLANIYOR, deterministik tarafta hiç yoktu.
#
# ÖLÇÜLDÜ (2026-08-07, plan_options, 23 asof günü, canlı evren 18 isim):
#     plan üretilen isim sayısı: min=1  medyan=2  ort=2.00  maks=9
#     oran olarak             : %5.6 … %11.1 … %50.0
#     dağılım: 1 isim→11 gün · 2→9 · 3→1 · 5→1 · 9→1
#
# ⚠ `ust_tel_orani` BİR KALİBRASYON DEĞİL, BİR TELDİR. Gözlemlenen maksimum
# %50; tel onun ÜSTÜNE konur ki normal davranışta hiç ateşlenmesin ve
# ateşlediğinde "bu daha önce hiç olmadı" desin.
saglik:
  kesit:
    pencere_gun: 20          # son N plan GÜNÜ (ardışık seans değil — replay karışık)
    ust_tel_orani: 0.60      # bir günde evrenin >%60'ında plan → araç şüphesi
    # STATE.md Backlog'undaki ön kayıt tetikleyicisi ("20 günde ort. <2 plan")
    # burada KOŞULABİLİR hâle geldi. Yazılı bir tetikleyici, onu hatırlayan
    # kişinin ömrü kadar yaşar (AGENTS.md §12).
    alt_tetik_ort: 2.0
    sinyal_ust_tel: 0.70     # analist sinyallerinin >%70'i tek yönde → şüphe
    sinyal_min_n: 10         # altında oran anlamsız (replay koşuları n=1-2)

rapor:
  dil: "tr"
  # ÖLÇÜLDÜ: alt kuyruk (−1.03pp) üst kuyruğun ~1.8 katı. Retail açığa satamaz →
  # sistemin en savunulabilir ürünü "hangisini azalt", "ne al" değil. Rapor bununla BAŞLAR.
  once_azalt_bolumu: true
  uyari: >-
    Bu bir karar destek aracıdır, yatırım tavsiyesi değildir. Kişisel ve deneysel
    kullanım içindir. Ölçülen kenar zayıftır ve istatistiksel olarak doğrulanması
    yıllar alır (bkz. required_n).

# ----------------------------------------------------------------------------
# Telegram bildirimi (Faz 8) — token/chat_id .env'den, ASLA config'ten
# ----------------------------------------------------------------------------
telegram:
  enabled: true
  # Giden her mesaj repoya jsonl olarak da yazılır: Telegram dışa aktarımı
  # gerekmeden "ne göndermişiz?" sorusu cevaplanabilir olsun (gold deseni).
  # `chat` alanına yalnız son 3 hane yazılır — repo private olsa da gereksiz
  # kimlik bilgisi biriktirmenin savunulacak bir tarafı yok.
  outbox_enabled: true
  outbox_file: "data/telegram_outbox.jsonl"
  # Telegram tek mesajda 4096 karakter kabul eder; pay bırakılır ve bölme
  # SATIR SINIRINDA yapılır — tablo/madde ortadan kesilmesin.
  mesaj_limiti: 4096
  mesaj_payi: 200
