name: Test

# Bu projenin kurallari YORUMDA degil TESTTE yasiyor (ADR #011): esik zeminleri,
# kolon↔sema esligi, LLM siniri kumeleri, katman disiplini, dokuman↔kod atiflari.
# O kurallarin CI'da kosmamasi, kurallarin "yerel makinede hatirlanan" seye geri
# donmesi demektir. Faz 8'in en ucuz ve en degerli parcasi bu.

on:
  push:
    branches: [main]
  pull_request:
  # ⚠ ZAMANLANMIS KOSU GEREKLI (2026-08-11 denetimi). Otonom is main'e
  # GITHUB_TOKEN ile push eder ve GitHub o push'larda workflow TETIKLEMEZ —
  # yani gunlerce kod degismezse suite hic kosmaz. Son kosu 2026-08-07'ydi.
  # Bagimlilik/API kirilmasi boylece yalnizca gunluk is dustugunde gorunurdu.
  schedule:
    - cron: "10 5 * * 1-5"
  workflow_dispatch: {}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm test --prefix dashboard
      - run: npm run build --prefix dashboard
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Python ve test bagimliliklari dogrulanmis runtime kilidinden kurulur.
      - name: Bagimliliklar
        run: |
          pip install --quiet -r requirements-runtime.txt
          pip install --quiet --no-deps -e .

      # ⚠ VERITABANI KURULUR. Eski hali kurmuyordu ve gerekcesi soyleydi:
      # "suite bir dis servisin kotasina bagli olarak kirmiziya doner ve
      # kirmizinin anlami asinir". O gerekce `yfinance`e CANLI gitmek icin
      # dogru, ama `db restore` icin GECERLI DEGIL: dump repoda, cekim yok,
      # ag yok, deterministik, ~10 saniye.
      #
      # Bedeli olculdu (2026-08-28 denetimi): `conftest.real_con` veritabani
      # yoksa `pytest.skip` eder, yani CI `1279 passed, 19 skipped` veriyordu
      # ve ATLANAN KUME tam olarak veri butunlugu katmaniydi —
      # `test_gecmis_asof_gelecegi_gormez` (look-ahead kilidi),
      # `test_temettu_duzeltmesi_uygulaniyor`, `test_bedelsiz_geri_duzeltiliyor`,
      # `test_canli_evrende_duzeltilmemis_bar_YOK`, `test_sasa_gercekten_eleniyor`,
      # `test_tatil_gunlerinde_bar_yok`, `test_hisse_barlari_TAMAMEN_tutarli`...
      #
      # Yani projenin kendi doktrininin ("en cok bulgu buradan cikti", AGENTS
      # §11/1) en pahali hata sinifini yakalayan testleri, testlerin otomatik
      # kostugu TEK yerde kosmuyordu. Koruma zaten yazilmisti, sadece kosmuyordu.
      #
      # Ag sizintisi ayrica kapatildi (`conftest.ag_yasak`), yani suite artik
      # hermetik: dis servis erisimi olmadan da yesil.
      - name: Veritabanini dumptan kur
        run: python -m src.cli db restore

      - name: pytest
        run: python -m pytest
