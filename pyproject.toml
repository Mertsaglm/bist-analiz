[tool.poetry]
name = "bist-analiz"
version = "0.1.0"
description = "BIST hisse analiz ve karar destek sistemi — nicel skorlama + LLM yorum katmanı + ölçüm harness'i"
authors = ["Mert"]
readme = "README.md"
package-mode = true
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
yfinance = "^0.2.66"
pandas = "^2.3"
numpy = "^2.0"
requests = "^2.32"
PyYAML = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.poetry.scripts]
bist = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
