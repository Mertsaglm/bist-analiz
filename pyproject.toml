# Poetry 2.x konvansiyonu: metadata [project] tablosunda durur.
# [tool.poetry] altındaki name/version/description/authors/readme/scripts
# kullanımı deprecate edildi (`poetry check` 6 uyarı basıyordu).
[project]
name = "bist-analiz"
version = "0.1.0"
description = "BIST hisse analiz ve karar destek sistemi — nicel skorlama + LLM yorum katmanı + ölçüm harness'i"
authors = [{ name = "Mert" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "yfinance (>=0.2.66,<0.3.0)",
    "pandas (>=2.3,<3.0)",
    "numpy (>=2.0,<3.0)",
    "requests (>=2.32,<3.0)",
    "PyYAML (>=6.0,<7.0)",
]

[project.scripts]
bist = "src.cli:main"

[tool.poetry]
package-mode = true
packages = [{ include = "src" }, { include = "advisor" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` KALDIRILDI: `pytest` çıktısının sonundaki "N passed" satırını gizliyordu
# ve README'deki test sayısı bu yüzden sessizce bayatlıyordu.
addopts = "--strict-markers"
# `ag_gerekli`: testlerde ağ VARSAYILAN OLARAK YASAK (tests/conftest.py
# ::ag_yasak). Gerçekten dış servise çıkması gereken bir test bu işaretle
# açılır — işaret görünürdür, sızıntı değildir.
markers = [
    "ag_gerekli: bu test bilerek dış ağa çıkar (gerekçesi docstring'inde)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
