# ============================================================================
# İşlem evreni — 18 hisse
#
# TÜM sayılar 2026-07-26'da yfinance'ten CANLI ölçüldü (son 505 bar):
#   medyan_tl_mn = medyan(Close × Volume) / 1e6
#   vol_pct      = log getiri std × √252 × 100
#   sifir_hacim_pct = Volume == 0 olan barların oranı
# Hafızadan değil, ölçümden. Yeniden ölçmek için: bist evren tara
#
# in_live    = canlı sinyal evreninde mi
# in_measure = ağırlık kalibrasyonuna (yavaş döngü backtest) girer mi
#              ≥2000 bar (~8 yıl) gerektirir; kısa geçmişli isim ağırlık belirleyemez
#
# ⚠ SURVIVORSHIP BIAS: bu sabit bir listedir, nokta-zamanlı BIST-100 üyeliği değil.
#   Backtest sonuçları bu eğilimi içerir. Düzeltiliyormuş gibi yapılmaz —
#   büyüklüğü ölçüm raporunda yazılır (`bist backtest` → reports/olcum_*.md;
#   reports/ gitignore'dadır, komutla yeniden üretilir).
# ============================================================================

seciim_kriterleri:
  - "medyan günlük işlem hacmi ≥ 200 mn TL (63g) — seviyelerin gerçek, slippage'ın küçük olması için"
  - "≥2000 bar (~8 yıl) geçmiş → in_measure=1"
  - "sıfır-hacim oranı (505 bar) < %5 — hacim tabanlı faktörlerin çöp üretmemesi için"
  - "sektör başına maksimum 2 (bankalar tek blok sayılır)"
  - "volatilite karması: düşük / orta / yüksek üçlüsü temsil edilsin"
  - "veri çözülmeyen veya idari kontrol altındaki isimler dışarıda"

