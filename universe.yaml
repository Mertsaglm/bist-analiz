# ==========================================================================
# ÖLÇÜM EVRENİ — canlı sinyal üretmez, yalnız kalibrasyon/backtest içindir
#
# NEDEN AYRI: kesitsel sıralama, sıralanacak bir DAĞILIM ister. 16 isimle
# "üst üçte bir" ≈ 3 isim demektir ve ölçüm gürültüde boğulur. Ölçüldü
# (2026-07-26): 16 isimlik evrende hiçbir faktör kenar üretmedi, IC t≈1.0-1.6'da
# takıldı. Plan bunu baştan söylüyordu: "işlem evreni ≠ ölçüm evreni".
#
# SEÇİM: ≥2000 bar (2015+), medyan günlük ciro ≥50mn TL, sıfır hacim <%3.
# 88 aday tarandı, 67'si geçti (2026-07-26 canlı ölçüm).
#
# ⚠ SURVIVORSHIP BIAS: liste BUGÜNÜN likiditesine göre seçildi. 2015'te işlem
#   görmeyen/likit olmayan isimler dışarıda, batmış/çıkmış isimler hiç yok.
#   Bu, sonuçları stratejinin LEHİNE eğer. Düzeltilmiyor — büyüklüğü bilinmiyor,
#   düzeltiyormuş gibi yapmak ölçümü sahtelemek olurdu. Raporda yazılı.
# ==========================================================================
