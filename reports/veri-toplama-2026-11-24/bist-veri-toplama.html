  .coverage-chart [data-code="6"], .coverage-chart [data-code="11"] { --mark: var(--blue,#4b83d1); }

<script>
(() => {
  const root = document.getElementById('coverage-bist');
  const find = (selector) => root.querySelector(selector);
  const data = JSON.parse(find('[data-coverage]').textContent);
  const bist = data.bist;
  const days = Object.keys(data.days);
  const state = {
    lane: 'live', period: 'all', day: bist ? '2026-11-23' : '2026-11-17', hour: bist ? '15' : '12',
    ...(window.openai?.widgetState?.privateContent || {})
  };
  const last = days.at(-1);
  const dayLabel = new Intl.DateTimeFormat('tr-TR', {day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  const monthLabel = new Intl.DateTimeFormat('tr-TR', {month:'long',timeZone:'UTC'});
  const formatDate = (day) => dayLabel.format(new Date(day+'T00:00:00Z'));
  const formatMonth = (day) => monthLabel.format(new Date(day.slice(0,7)+'-01T00:00:00Z'));
  const fmt = (s) => formatDate(s.slice(0,10))+' '+s.slice(11,16);
  const chartTitle = bist ? 'BIST' : 'Altın';
  const captions = {
    live: bist ? 'İş Yatırım · hisse fiyatı' : 'İş Bankası · gram altın',
    archive: 'Truncgil ve kur · ham arşiv',
    write: 'Günlük hisse barı · yazım saati',
    daily: bist ? 'Günlük veri · koşu günlüğü' : 'Günlük rapor · yazım saati',
    action: 'GitHub Actions · koşu saati'
  };
  const validLanes = bist ? ['live','write','daily','action'] : ['live','archive','daily','action'];
  const names = {
    1:['✓','Tam veri'], 2:['◐','Eksik veri'], 3:['×','Geçerli veri yok'], 4:['◇','Beklenen saatte fiyat kaydı yok'],
    5:['–','Atlandı / iptal'], 6:['•','Kayıt / koşu var'], 7:['!','Koşu hatası'], 8:['▨','Kapalı'],
    9:['…','Kesit saati / bekleniyor'], 10:['○','Kayıt yok / bilinmiyor'], 11:['↗','SQL yazım damgası sonraki gün']
  };
  const priorities = [3,2,4,7,1,11,6,5,8,9,10];
  const laneSelect = find('[data-lane]');
  const periodSelect = find('[data-period]');
  const daySelect = find('[data-day]');
  const hourSelect = find('[data-hour]');
  const heat = find('[data-heat]');
  const selected = find('[data-selected]');
  const overview = find('[data-overview]');
  const svgNS = 'http://www.w3.org/2000/svg';
  const github = 'https://github.com/Mertsaglm/'+data.repo;
  let visible = [];
  let hourFrom = 0;
  let hourTo = 23;
  let heatLayout;
  function h(tag, text, className) {
    const el = document.createElement(tag);
    if (text) el.textContent = text;
    if (className) el.className = className;
    return el;
  }
  function glyph(code) {
    const el = h('span',names[code][0],'coverage-glyph');
    el.dataset.code = code;
    el.setAttribute('aria-hidden','true');
    return el;
  }
  function option(select,value,label) {
    const el=h('option',label);
    el.value=value;
    select.append(el);
  }
  function svg(tag,attrs) {
    const el=document.createElementNS(svgNS,tag);
    for (const [name,val] of Object.entries(attrs)) el.setAttribute(name,val);
    return el;
  }
  function cell(svgRoot,x,y,w,hgt,codes,tooltip) {
    const group=svg('g',{'data-tooltip':tooltip});
    const width=w/codes.length;
    codes.forEach((code,index)=>{
      group.append(svg('rect',{x:x+index*width,y,width:Math.max(width,.2),height:hgt,
        'data-code':code,class:'coverage-cell state-'+code}));
    });
    svgRoot.append(group);
  }
  function codeList(rows, fallback) {
    const codes = new Set(rows.map(r=>r[1]));
    if (!codes.size) return [fallback];
    return priorities.filter(code=>codes.has(code));
  }
  function dailyCode(day) {
    const obj=data.days[day];
    const primary=obj.daily.primary;
    if (primary) {
      if (bist && primary[1].slice(0,10)>day) return 11;
      if (!bist && primary[0]<2) return 2;
      return 1;
    }
    return day===last ? 9 : bist && !obj.open ? 8 : 10;
  }
  function hourCode(day,hour) {
    if (day===last && (hour>=17)) return 9;
    if (state.lane==='live' && !data.days[day].open) return 8;
    return 10;
  }
  function lanesFor(r) { return data.days[r].lanes[state.lane] || {}; }
  function overviewCodes(day,lane) {
    if(lane==='market') return [dailyCode(day)];
    if(lane==='reports') return [data.days[day].daily.secondary ? 6 : day===last ? 9 : 10];
    const rows=Object.values(data.days[day].lanes[lane] || {}).flat();
    return codeList(rows,lane==='live' && !data.days[day].open ? 8 : 10);
  }
  function link(label,url) {
    const a=h('a',label);
    a.href=url;
    a.target='_blank';
    a.rel='noopener noreferrer';
    return a;
  }
  function selectPoint(day,hour,save=true) {
    state.day=day;
    state.hour=hour;
    daySelect.value=day;
    hourSelect.value=hour;
    if(save) {
      window.openai?.setWidgetState?.({modelContent:{project:chartTitle,day,hour,lane:captions[state.lane]},privateContent:state})?.catch(()=>{});
    }
    selection();
    drawSelection();
  }
  function drawSelection() {
    heat.querySelector('.coverage-outline')?.remove();
    if (!heatLayout) return;
    const index=visible.indexOf(state.day);
    if (index<0) return;
    const {left,top,dx,dy}=heatLayout;
    const hour=Number(state.hour);
    const all=state.hour==='all';
    heat.append(svg('rect',{x:left+index*dx,y:all?top:top+(hour-hourFrom)*dy,
      width:dx,height:all?dy*(hourTo-hourFrom+1):dy,class:'coverage-outline'}));
  }
  function overviewDraw() {
    for (const graph of overview.querySelectorAll('svg')) {
      const lane=graph.dataset.strip;
      const width=graph.clientWidth;
      if(!width) continue;
      graph.setAttribute('viewBox','0 0 '+width+' 13');
      graph.setAttribute('height','13');
      graph.replaceChildren();
      const dx=width/days.length;
      days.forEach((d,i)=>{
        const codes=overviewCodes(d,lane);
        cell(graph,i*dx,0,Math.max(dx-.38,.5),13,codes,formatDate(d)+' · '+codes.map(c=>names[c][1]).join(' / '));
      });
    }
  }
  function draw() {
    const width=heat.clientWidth;
    if(!width || !visible.length) return;
    const left=51, top=12, dy=12, right=10, bottom=27;
    const dx=(width-left-right)/visible.length;
    const height=top+(hourTo-hourFrom+1)*dy+bottom;
    heatLayout={left,top,dx,dy,height};
    heat.setAttribute('viewBox','0 0 '+width+' '+height);
    heat.setAttribute('height',height);
    heat.replaceChildren();
    let previousLabelX=-Infinity;
    const firstMonthEnd=visible.findIndex(d=>d.slice(0,7)!==visible[0].slice(0,7));
    visible.forEach((day,i)=>{
      const byHour=lanesFor(day);
      for(let hour=hourFrom;hour<=hourTo;hour++){
        const rows=byHour[hour] || [];
        const codes=codeList(rows,hourCode(day,hour));
        const value=rows.length ? ' · '+rows.length+' kayıt' : '';
        cell(heat,left+i*dx,top+(hour-hourFrom)*dy,Math.max(dx-.5,.55),dy-1,codes,
          formatDate(day)+' · '+String(hour).padStart(2,'0')+'.00'+value+' · '+codes.map(c=>names[c][1]).join(' / '));
      }
      const monthStart=i===0 || day.slice(0,7)!==visible[i-1].slice(0,7);
      const isWide=width>=550;
      const shortMonth=width<760 || (firstMonthEnd>0 && firstMonthEnd*dx<68 && i<=firstMonthEnd);
      const skipFirst=i===0 && firstMonthEnd>0 && firstMonthEnd*dx<32;
      const label=state.period==='all' ? (monthStart && !skipFirst ? formatMonth(day).slice(0,shortMonth?3:10) : '') :
        i===0 || i===visible.length-1 || (i%Math.max(4,Math.ceil(visible.length/(isWide?9:6)))===0 && i<visible.length-2) ? day.slice(8) : '';
      if (label) {
        const x=left+i*dx+(state.period==='all'?1:dx/2);
        if (x-previousLabelX<22) return;
        previousLabelX=x;
        const element=svg('text',{x,y:height-8,'text-anchor':state.period==='all'?'start':'middle',class:'text-small'});
        element.textContent=label;
        heat.append(element);
      }
    });
    for(let hour=hourFrom;hour<=hourTo;hour+=2){
      const element=svg('text',{x:left-6,y:top+(hour-hourFrom)*dy+9,'text-anchor':'end',class:'text-small tabular-nums'});
      element.textContent=String(hour).padStart(2,'0')+'.00';
      heat.append(element);
    }
    drawSelection();
  }
  function selection() {
    const day=state.day;
    const obj=data.days[day];
    const byHour=lanesFor(day);
    const rows=state.hour==='all'?Object.values(byHour).flat().sort():byHour[state.hour]||[];
    const hour=state.hour==='all'?'': ' · '+state.hour.padStart(2,'0')+'.00–'+state.hour.padStart(2,'0')+'.59';
    selected.replaceChildren(h('h3',formatDate(day)+hour));
    const p=obj.daily.primary;
    if (bist && p) {
      selected.append(h('p',p[0]+' hisse barı'+(obj.daily.secondary?' · '+obj.daily.secondary:'')+'. Arşivde kalan yazım damgaları '+fmt(p[1])+' – '+fmt(p[2])+'.','text-small'));
    } else if (!bist && p) {
      selected.append(h('p','Günlük referans '+p[0]+'/2 alan (ons ve USD/TRY)'+(obj.daily.secondary?' · Rapor yazımı '+fmt(obj.daily.secondary):' · Rapor kaydı yok')+'.','text-small'));
    } else {
      const label=bist && !obj.open?'Piyasa kapalı.':day===last?'Bu tarih için günlük kapanış arşivde henüz yok.':'Bu tarihe ait günlük fiyat satırı yok.';
      selected.append(h('p',label,'text-small'));
    }
    if (!rows.length) {
      const code=state.hour==='all' ? (state.lane==='live'&&!obj.open?8:10) : hourCode(day,Number(state.hour));
      selected.append(h('p',names[code][1],'text-small coverage-notes'));
    }
    for (const [at,code,label,extra,id] of rows) {
      const row=h('div',null,'coverage-item');
      const title=h('span',null,'tabular-nums');
      title.append(glyph(code),document.createTextNode(' '+(code===4?at.slice(0,5):at)));
      const body=h('span',label);
      if(extra) body.append(h('span',extra,'coverage-source text-small coverage-notes'));
      if(id) body.append(link('GitHub koşusu',github+'/actions/runs/'+id));
      row.append(title,body);
      selected.append(row);
    }
  }
  function refresh() {
    visible=days.filter(d=>state.period==='all'||d.startsWith(state.period));
    if(!visible.includes(state.day)) {
      state.day=visible.at(-1);
      state.hour='all';
    }
    hourFrom=state.lane==='live' ? (bist?10:9) : 0;
    hourTo=state.lane==='live' && bist ? 22 : 23;
    const observed=visible.flatMap(d=>Object.keys(lanesFor(d)).map(Number));
    if(observed.length){
      hourFrom=Math.min(hourFrom,...observed);
      hourTo=Math.max(hourTo,...observed);
    }
    if (state.hour!=='all' && (Number(state.hour)<hourFrom||Number(state.hour)>hourTo)) state.hour='all';
    daySelect.replaceChildren();
    for (const day of visible) option(daySelect,day,formatDate(day));
    hourSelect.replaceChildren();
    option(hourSelect,'all','Tüm gün');
    for(let hour=hourFrom;hour<=hourTo;hour++) option(hourSelect,String(hour),String(hour).padStart(2,'0')+'.00');
    const stat=data.stats[state.lane];
    const c=stat[2];
    const suffix=state.lane==='live' ? ' · '+(c[1]||0)+' tam · '+(c[2]||0)+' kısmi · '+(c[3]||0)+' geçerli fiyat yok' :
      state.lane==='archive' ? ' · '+c[1]+' tam · '+c[2]+' eksik ham satır' :
      state.lane==='action' ? ' · '+Object.values(c).reduce((a,b)=>a+b,0)+' koşu · '+(c[7]||0)+' hata' : '';
    find('[data-lane-summary]').textContent=(state.period==='all'?'':'Tüm dönem · ')+fmt(stat[0])+' – '+fmt(stat[1])+suffix;
    draw();
    selectPoint(state.day,state.hour,false);
  }
  find('[data-range]').textContent=formatDate(days[0])+' – '+fmt(data.asof)+' · İstanbul saati';
  const stripInfo=[['market',bist?'Hisse barı (SQL)':'Ons ve kur (SQL)'],[bist?'write':'archive',bist?'Bar yazım saati':'Ham altın/kur'],['live',bist?'İş Yatırım fiyatı':'İş Bankası fiyatı'],[bist?'daily':'reports',bist?'Günlük koşu günlüğü':'Günlük rapor'],['action','GitHub Actions']];
  for(const [key,label] of stripInfo){
    const row=h('div',null,'coverage-strip');
    const graph=svg('svg',{role:'img','aria-label':label+' gün bazında',class:'coverage-interactive','data-strip':key});
    row.append(h('span',label,'text-small'),graph);
    overview.append(row);
    graph.addEventListener('click',e=>{
      const r=graph.getBoundingClientRect();
      const day=days[Math.min(days.length-1,Math.floor((e.clientX-r.left)/r.width*days.length))];
      if(!day) return;
      state.lane=key==='market'?(bist?'write':'daily'):key==='reports'?'daily':key;
      state.period=day.slice(0,7);
      state.day=day;
      state.hour='all';
      laneSelect.value=state.lane;
      periodSelect.value=state.period;
      refresh();
      selectPoint(day,'all');
    });
  }
  for(const key of validLanes) option(laneSelect,key,captions[key]);
  option(periodSelect,'all','Tüm dönem');
  for(const month of new Set(days.map(d=>d.slice(0,7)))) option(periodSelect,month,formatMonth(month));
  if(!validLanes.includes(state.lane)) state.lane='live';
  if(!Array.from(periodSelect.options).some(o=>o.value===state.period)) state.period='all';
  laneSelect.value=state.lane;
  periodSelect.value=state.period;
  for(const code of [1,2,3,4,7,6,5,8,9,10,...(bist?[11]:[])]){
    const item=h('span',null,'coverage-key text-small');
    item.append(glyph(code),document.createTextNode(names[code][1]));
    find('[data-legend]').append(item);
  }
  const method=find('[data-method]');
  const historical=bist?'Hisse barı':'Günlük ons/kur serisi';
  method.append(h('p',historical+' tarihleri '+formatDate(data.range[0])+' – '+formatDate(data.range[1])+'. Eski piyasa tarihleri geçmiş veri yüklemesini de kapsar.'));
  method.append(h('p','Üst şeritler gün bazında, ısı haritası kayıt saatine göre. Bir hücrede birden çok renk varsa o gün veya saatte farklı sonuçlar görülmüş.'));
  method.append(h('p','Mor hücreler 19 Kasım ve sonrasındaki bilinen izleme penceresinde fiyat denetimi kaydı bulunmayan saatler. Başarısız çekim yalnız kayıtla doğrulandığında kırmızı. GitHub koşu durumu fiyatın ulaştığını tek başına kanıtlamaz.'));
  method.append(h('p',bist?'Hisse barı şeridindeki yeşil arşivde bar bulunduğunu gösterir. Mavi ok, eldeki tüm yazım damgalarının bar tarihinden sonra olduğunu gösterir. Güncelleme önceki damgayı değiştirebildiği için ilk çekim saati bu alandan kesinleşmez.':'Ham altın/kur şeridi arşivdeki 10 alanın doluluğunu gösterir. Banka fiyatı ayrı kaynaktır. Hafta sonu ham arşivde gelen satırlar gösterilir.'));
  const sourceRow=h('p',null,'viz-row');
  sourceRow.append(link('SQL kesiti',github+'/blob/'+data.sha+'/data/'+(bist?'bist.sql':'altin.sql')),
    link('Fiyat defteri',github+'/blob/'+data.sha+'/data/advisor/accounts/paper-2026-09-25/events.jsonl'),
    link('Actions',github+'/actions'));
  if(bist) sourceRow.append(link('BIST tatil takvimi','https://www.borsaistanbul.com/files/pay-piyasasi-2026-yili-tatil-tablosu.pdf'));
  else sourceRow.append(link('Ham arşiv',github+'/tree/main/data/archive'));
  method.append(sourceRow);
  laneSelect.addEventListener('change',()=>{state.lane=laneSelect.value;refresh();selectPoint(state.day,state.hour);});
  periodSelect.addEventListener('change',()=>{state.period=periodSelect.value;refresh();selectPoint(state.day,state.hour);});
  daySelect.addEventListener('change',()=>selectPoint(daySelect.value,'all'));
  hourSelect.addEventListener('change',()=>selectPoint(state.day,hourSelect.value));
  heat.classList.add('coverage-interactive');
  heat.addEventListener('click',e=>{
    if(!heatLayout) return;
    const r=heat.getBoundingClientRect();
    const {left,top,dx,dy}=heatLayout;
    const index=Math.floor((e.clientX-r.left-left)/dx);
    const hour=hourFrom+Math.floor((e.clientY-r.top-top)/dy);
    if(visible[index] && hour>=hourFrom && hour<=hourTo) selectPoint(visible[index],String(hour));
  });
  refresh();
  const observer=new ResizeObserver(()=>{overviewDraw();draw();});
  observer.observe(heat);
  observer.observe(overview);
})();
</script>
